[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ikiastrro-analytics"
version = "0.1.0"
description = "Reproducible descriptive population analytics for IkiAstrro v10"
requires-python = ">=3.12"
dependencies = ["pyodbc>=5.2"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
ikiastrro-analytics = "ikiastrro_analytics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
